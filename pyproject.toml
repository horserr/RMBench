[project]
name = "modify"
version = "0.1.0"
requires-python = ">=3.10,<3.11"

dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "numpy==1.26.4",
  "opencv-python==4.10.0.84",
  "opencv-python-headless==4.10.0.84",
  "transforms3d==0.4.2",
  "sapien==3.0.0b1",
  "scipy==1.10.1",
  "mplib==0.2.1",
  "gymnasium==0.29.1",
  "trimesh==4.4.3",
  "open3d==0.18.0",
  "imageio==2.34.2",
  "pydantic>=2.5",
  "PyYAML>=6",
  "zarr",
  "openai",
  "huggingface_hub==0.25.0",
  "h5py>=3.8",
  "websockets>=13.0",
  "msgpack>=1.0.8",
  "msgpack-numpy>=0.4.8",
  "rich>=13.7",
  "azure==4.0.0",
  "azure-ai-inference",
  "pyglet<2",
  "wandb",
  "moviepy",
  "termcolor",
  "av",
  "matplotlib",
  "warp-lang==1.12.0",
  # git based dependencies
  "pytorch3d",
  "nvidia-curobo",
  "xpolicylab",
  "setuptools<82.0.0",
]

[build-system]
requires = ["setuptools==69.5.1"]

[tool.uv]
# This repo is a collection of scripts/modules run from the repo root, not a
# distributable package, so don't build/install it (only its dependencies).
package = false
no-build-isolation-package = ["pytorch3d", "nvidia-curobo"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d", branch = "stable" }
xpolicylab = { path = "./XPolicyLab", editable = true }
nvidia-curobo = { path = "./env/curobo", editable = true }
